name: Deploy 网页版 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'last-token/**'
      - 'model-atlas/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 站点根就是 last-token/，这样 https://liveldy.github.io/last-token/ 这个地址不用变；
      # 模型能力图鉴挂在同一站点的 /model-atlas/ 下面。
      - name: 组装站点
        run: |
          mkdir -p _site/model-atlas
          cp -R last-token/. _site/
          cp -R model-atlas/. _site/model-atlas/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
